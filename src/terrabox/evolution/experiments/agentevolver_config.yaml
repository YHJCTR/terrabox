# AgentEvolver experiment configuration
# arXiv 2511.10395: Towards Efficient Self-Evolving Agent System

train_data: data/openearth/train.json
eval_data: data/openearth/eval.jsonl
store_dir: evolution_store/agentevolver
output: evolution_store/agentevolver/eval_results.json

# Self-Questioning settings
mine_limit: 500                # max train trajectories for template mining
n_per_template: 5              # generated tasks per template
max_templates: 10              # top-N templates to use

# Self-Navigating settings
exploit_threshold: 0.3         # BM25 score below = novel → explore
top_k_similar: 5               # similar episodes for exploitation
top_k_reward: 3                # high-reward episodes for guidance

# Self-Attributing settings
gamma: 0.95                    # discount factor for credit assignment

# Evaluation settings
eval_limit: 100                # max eval cases (set to null for all)
