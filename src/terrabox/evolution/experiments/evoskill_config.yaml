# EvoSkill experiment configuration
# arXiv 2603.02766: Automated Skill Discovery for Multi-Agent Systems

eval_data: data/openearth/eval.jsonl
store_dir: evolution_store/evoskill
output: evolution_store/evoskill/eval_results.json

# Discovery loop settings
n_episodes: 50                 # episodes to run in discovery phase
failure_f1_threshold: 0.5      # below this F1 = failure → trigger proposer

# Pareto frontier settings
max_frontier_size: 50          # max skills in frontier
alpha: 0.7                     # weight: f1_delta (0.7) vs generality (0.3)
eval_sample_size: 20           # eval cases per skill evaluation

# Injection settings
top_n: 5                       # skills to inject per query
enable_transfer: true          # enable cross-domain skill transfer
