# SkillRL experiment configuration
# arXiv 2602.08234: Evolving Agents via Recursive Skill-Augmented Reinforcement Learning

train_data: data/openearth/train.json
eval_data: data/openearth/eval.jsonl
store_dir: evolution_store/skillrl
output: evolution_store/skillrl/eval_results.json

# Distillation settings
distill_limit: 500             # max training trajectories to distill from
success_f1_threshold: 0.8      # min F1 to distill as success
failure_f1_threshold: 0.2      # max F1 to distill as failure

# Retrieval settings
top_k: 3                       # skills injected per query

# Evolution settings
window_size: 20                # rolling window for drift detection
drop_threshold: 0.10           # relative F1 drop to trigger re-evolution
max_new_skills_per_cycle: 3    # max skills added per evolution cycle

# Optional: also run earthbench
# train_data_eb: data/earthbench/question.json
# eval_data_eb: data/earthbench/eval.jsonl
