# MemRL experiment configuration
# arXiv 2601.03192: Self-Evolving Agents via Runtime Reinforcement Learning on Episodic Memory

train_data: data/openearth/train.json
eval_data: data/openearth/eval.jsonl
memory_db: evolution_store/memrl/episodic_memory.db
output: evolution_store/memrl/eval_results.json

# Memory population settings
populate_limit: 1000           # max training trajectories to store as memories

# Retrieval settings
candidate_k: 20                # phase-1 candidates (semantic similarity)
top_k: 5                       # phase-2 final memories (Q-value ranking)

# Bellman update settings
alpha_0: 0.3                   # initial learning rate
alpha_min: 0.05                # minimum learning rate
decay_rate: 0.1                # per-visit learning rate decay
gamma: 0.9                     # discount factor

# Evaluation settings
eval_limit: null               # set to integer to limit (null = all)
online_mode: true              # update Q-values after each eval episode
