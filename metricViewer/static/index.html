<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metric Viewer</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Metric Viewer</h1>
      <p>单实验指标、进度、双实验交集对比和静态提示词查看</p>
    </div>
    <button id="refresh">刷新实验列表</button>
  </header>

  <main>
    <section class="toolbar">
      <label>
        模式
        <select id="mode">
          <option value="single">单实验指标</option>
          <option value="compare">双实验对比</option>
        </select>
      </label>
      <label>
        当前实验
        <select id="current"></select>
      </label>
      <label id="baselineBox" class="hidden">
        对比基线
        <select id="baseline"></select>
      </label>
      <label>
        Scope
        <select id="scope">
          <option value="all">all</option>
          <option value="online">online</option>
          <option value="offline">offline</option>
        </select>
      </label>
      <button id="load">展示指标</button>
      <button id="showPrompt">展示静态提示词</button>
    </section>

    <section id="notice" class="notice hidden"></section>

    <section class="grid">
      <div class="panel">
        <h2>核心指标</h2>
        <div id="cards" class="cards"></div>
      </div>
      <div class="panel">
        <h2>分类 F1</h2>
        <canvas id="f1Chart" height="180"></canvas>
      </div>
    </section>

    <section class="panel">
      <h2>明细表</h2>
      <div id="table"></div>
    </section>

    <section id="promptPanel" class="panel hidden">
      <h2>静态提示词</h2>
      <div id="promptMeta" class="meta"></div>
      <pre id="promptText"></pre>
    </section>
  </main>

  <script src="/static/main.js"></script>
</body>
</html>
