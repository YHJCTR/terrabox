# ============================================================
# Terrabox Tool Configuration — EXAMPLE
# ============================================================
# Copy this file to agent_config.yaml and fill in local model paths.
#   cp agent_config.example.yaml agent_config.yaml
#
# agent_config.yaml is git-ignored so local model paths are not committed.
# Docker mode is the supported path for geo_perception tools in this branch.
# ============================================================

# Host-side data directory mounted into model containers. Uploaded/input images
# must be under this tree so containers can read the same absolute paths.
docker_data_mount_host: /data1

# ── VLM image analysis: geo_perception.vlm_analyze ──────────────────────────
# Download default weights with:
#   ./scripts/download_weights.sh --skip-sam2 --skip-remoteclip --skip-remotesam --skip-strip-rcnn --skip-instructsam
vlm_model_path: /path/to/terrabox/models/vlm
vlm_port: 9000
vlm_gpu_devices: "0"
vlm_tensor_parallel: 1
vlm_max_model_len: 16384
vlm_gpu_memory_utilization: 0.8

# ── SAM2 segmentation: geo_perception.sam2_segment ──────────────────────────
# Host directory must contain sam2.1_hiera_large.pt.
sam2_checkpoint_host: /path/to/terrabox/models/sam2_checkpoints
# Host directory must expose sam2.1/sam2.1_hiera_l.yaml inside the container.
# When using the official SAM2 source checkout this is usually:
#   /path/to/sam2/sam2/configs
sam2_config_host: /path/to/sam2/sam2/configs
sam2_port: 9002
sam2_gpu_devices: "0"

# ── RemoteCLIP retrieval/classification: geo_perception.remoteclip_analysis ─
# Host directory should be the HuggingFace local-dir produced by
# scripts/download_weights.sh. The Docker server accepts either a flat
# RemoteCLIP-ViT-L-14.pt file or a HuggingFace snapshot cache layout.
remoteclip_ckpt_host: /path/to/terrabox/models/remoteclip
remoteclip_port: 9003
remoteclip_gpu_devices: "0"

# ── RemoteSAM tasks: geo_perception.remotesam ───────────────────────────────
# Host directory must contain swin_base_patch4_window12_384_22k.pth.
remotesam_checkpoint_host: /path/to/terrabox/models/remotesam
remotesam_port: 9004
remotesam_gpu_devices: "0"

# ── Strip R-CNN detection: geo_perception.strip_rcnn_detect ─────────────────
# Host checkpoint directory must contain stripnet_s.pth.
strip_rcnn_ckpt_host: /path/to/terrabox/models/strip_rcnn
# Host config directory should contain strip_rcnn/orig/strip_rcnn_s_fpn_1x_dota_le90.py.
strip_rcnn_config_host: /path/to/Strip-RCNN/configs
strip_rcnn_port: 9005
strip_rcnn_gpu_devices: "0"

# ── InstructSAM counting/segmentation: geo_perception.instructsam ───────────
# Host model directory must contain:
#   sam2_hiera_large.pt
#   GeoRSCLIP-ViT-L-14.pt
# It uses the host vLLM service for the counting step.
instructsam_models_host: /path/to/terrabox/models/instructsam
instructsam_port: 9006
instructsam_gpu_devices: "0"
